description: 'Active Membranes serves a live, unauthenticated Model Context Protocol endpoint from its
  own hostname at https://www.activemembrane.com/_api/mcp. It is the Wix Site MCP runtime, not a first-party
  server the company wrote: the endpoint is provisioned by the Wix platform for every site that enables
  it, the tool names and input schemas are Wix''s, and the tool descriptions instruct an agent in how
  to drive Wix APIs. What is first-party is the decision to enable it, the site content it exposes, and
  the advertisement of it in the company''s own llms.txt. There is no other API surface: Active Membranes
  is a water-technology hardware company with no developer program, no REST or GraphQL contract and no
  SDKs.'
