aid: active-membranes
name: Active Membranes
description: 'Active Membranes is a California water-technology company, founded in 2022 out of research
  at the UCLA Samueli School of Engineering, that builds electrically conductive "electro-active" reverse-osmosis
  membranes for desalination and water reuse. Where a conventional RO membrane filters passively and is
  cleaned after it fouls, Active Membranes embeds conductive material in the membrane''s polymer matrix
  and uses a control unit it calls the Active Box to apply a tunable low electrical potential at the membrane
  surface, electrostatically repelling scale-forming ions and charged organic foulants in real time. The
  modules ship in the standard 8-inch by 40-inch spiral-wound format so they retrofit into existing pressure
  vessels, and are aimed at seawater and brackish desalination, produced-water and industrial reuse. The
  company reports field results including roughly 48% less irreversible fouling in produced-water reuse,
  up to 70% longer cleaning cycles in brackish water, and a Ventura County study citing about 57% lower
  cost and 64% less footprint. It has raised roughly $3.24M in seed funding from Natural Ventures, Echo
  River Capital and Pacifica Water Solutions, won the 2023 Global Water Summit Water Technology Idol award,
  and was selected as a Qualified Team in the XPRIZE Water Scarcity competition. Active Membranes sells
  capital equipment, not software: it operates no developer program, publishes no OpenAPI, GraphQL or
  SDK, and lists no pricing. It does, however, serve two machine-readable surfaces from its own hostname
  — a substantial hand-written /llms.txt, and a live, unauthenticated Model Context Protocol endpoint
  at /_api/mcp exposing nine tools over the public site content. Both are Wix platform features the company
  chose to enable and advertise rather than first-party engineering.'
