apis:
- aid: active-membranes:active-membranes-site-mcp
  name: Active Membranes Site MCP Server
  description: 'A live, unauthenticated Model Context Protocol endpoint served from Active Membranes''
    own hostname at https://www.activemembrane.com/_api/mcp and advertised by the company in its own llms.txt.
    An anonymous JSON-RPC tools/list returns HTTP 200 and nine tools with full JSON Schema inputs: GetBusinessDetails,
    SearchInSite, SearchSiteApiDocs, BrowseWixRESTDocsMenu, ReadFullDocsArticle, ReadFullDocsMethodSchema,
    GenerateVisitorToken, CallWixSiteAPI and ExecuteWixAPI. This is the Wix Site MCP runtime rather than
    a server the company wrote — the tools and schemas are Wix''s, and GetBusinessDetails reports the
    Blog app as the only installed business solution, so what an agent can actually reach is the public
    site and its blog posts. It is recorded because it is real, reachable, first-party-hosted and deliberately
    advertised. Active Membranes publishes no other API of any kind.'
