note: >-
  Nothing is served. Active Membranes runs on Wix behind Cloudflare, and the Wix
  edge answers every unknown /.well-known/* path with HTTP 400 and an HTML error
  shell rather than 404 — so these are misses, not documents. No security.txt,
  no OIDC or OAuth metadata, no api-catalog, no ai-plugin.json, and no A2A agent
  card on either host. Recorded as an absence; no WellKnown or SecurityTxt
  pointer is wired into apis.yml, because the provider serves none of these.
  The one machine-readable discovery document the company does publish is
  /llms.txt (HTTP 200), which is captured separately in llms/.

